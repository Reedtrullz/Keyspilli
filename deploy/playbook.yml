---
# Playbook: deploy-keyspilli.yml
# Description: Deploy Keyspilli to the Racknerd VPS as GHCR-backed Docker
#   containers (web + worker) and expose it at keys.reidar.tech through
#   host Caddy.
# Requirements:
#   - Target host has Docker, Docker Compose v2, and Caddy installed.
#   - Target host can pull ghcr.io/reedtrullz/keyspilli (public) or is logged
#     into GHCR if the image is private.
#   - community.docker collection installed on the control node.
# Variables:
#   - docker_image: immutable image tag to deploy for the web container
#     (for example ghcr.io/reedtrullz/keyspilli:<git-sha>)
#   - worker_image: immutable image tag for the worker container
#     (for example ghcr.io/reedtrullz/keyspilli-worker:<git-sha>)
#   - app_version: full 40-character git SHA exposed by /api/health
#     (default APP_VERSION env)
#   - allow_mutable_tag: set true only for an intentional latest/manual
#     recovery deploy
#   - app_domain: public domain (inventory default keys.reidar.tech)
# Usage:
#   APP_VERSION=$(git rev-parse HEAD) ansible-playbook \
#     -i deploy/inventory/hosts.yml deploy/playbook.yml \
#     -e "docker_image=ghcr.io/reedtrullz/keyspilli:$(git rev-parse --short=12 HEAD)" \
#     -e "worker_image=ghcr.io/reedtrullz/keyspilli-worker:$(git rev-parse --short=12 HEAD)"

- name: Deploy Keyspilli to VPS
  hosts: keyspilli
  become: true
  gather_facts: false

  vars:
    app_name: keyspilli
    container_name: keyspilli
    worker_container_name: keyspilli-worker
    app_dir: /opt/apps/keyspilli
    docker_image: ghcr.io/reedtrullz/keyspilli:latest
    worker_image: ghcr.io/reedtrullz/keyspilli-worker:latest
    app_version: "{{ lookup('ansible.builtin.env', 'APP_VERSION') | default('latest', true) }}"
    allow_mutable_tag: false
    health_url: "http://{{ app_bind_address }}:{{ app_host_port }}/api/health"
    public_health_url: "https://{{ app_domain }}/api/health"
    # The smoke fixture is overrideable for catalog changes, while this
    # stable seeded arrangement exercises both PDF layouts after deploy.
    pdf_smoke_song_id: "{{ lookup('ansible.builtin.env', 'KEYSPILLI_PDF_SMOKE_SONG_ID') | default('j-brahms-brahms-horn-trio-a', true) }}"
    caddy_marker_name: Keyspilli
    rollback_image: "{{ app_name }}:rollback"
    rollback_worker_image: "{{ app_name }}-worker:rollback"
    keyspilli_api_token: "{{ lookup('ansible.builtin.env', 'KEYSPILLI_API_TOKEN') | default('', true) }}"

  pre_tasks:
    - name: Validate deployment variables
      ansible.builtin.assert:
        that:
          - app_domain is match('^[a-z0-9.-]+$')
          - app_host_port | int > 1024
          - app_host_port | int < 65536
          - app_bind_address in ['127.0.0.1', 'localhost']
          - docker_image is match('^ghcr.io/[a-z0-9._-]+/[a-z0-9._-]+:[A-Za-z0-9._-]+$')
          - worker_image is match('^ghcr.io/[a-z0-9._-]+/[a-z0-9._-]+:[A-Za-z0-9._-]+$')
          - allow_mutable_tag | bool or docker_image is match('^ghcr.io/[a-z0-9._-]+/[a-z0-9._-]+:(?:staging-)?[0-9a-f]{7,40}$')
          - allow_mutable_tag | bool or worker_image is match('^ghcr.io/[a-z0-9._-]+/[a-z0-9._-]+:(?:staging-)?[0-9a-f]{7,40}$')
          - allow_mutable_tag | bool or app_version is match('^[0-9a-f]{40}$')
        fail_msg: >-
          Invalid Keyspilli deployment variables. Production deploys require
          immutable SHA-like GHCR image tags for both web and worker, and
          app_version must be the full 40-character git SHA exposed by
          /api/health. Set allow_mutable_tag=true only for an intentional
          mutable-tag deploy.
        success_msg: Keyspilli deployment variables validated.
      tags: [always]

    - name: Assert API token is configured for production
      ansible.builtin.assert:
        that:
          - keyspilli_api_token | length >= 32
        fail_msg: >-
          keyspilli_api_token must be set in Ansible Vault with at least 32 characters.
          The application rejects all mutation requests without it (fail-closed auth).

    - name: Verify Docker is available on target host
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      check_mode: false
      tags: [always]

    - name: Verify Docker Compose is available on target host
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false
      check_mode: false
      tags: [always]

    - name: Verify Caddy is available on target host
      ansible.builtin.command: caddy version
      register: caddy_version
      changed_when: false
      check_mode: false
      tags: [always]

  tasks:
    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: deploy
        group: deploy
        mode: '0755'
      tags: [deploy]

    - name: Ensure local backup directory exists
      ansible.builtin.file:
        path: /backups
        state: directory
        owner: root
        group: root
        mode: '0750'
      tags: [backup]

    - name: Install backup script beside the deployment
      ansible.builtin.copy:
        src: backup.sh
        dest: "{{ app_dir }}/backup.sh"
        owner: root
        group: root
        mode: '0750'
      tags: [backup]

    - name: Install backup runner
      ansible.builtin.template:
        src: templates/keyspilli-backup-runner.sh.j2
        dest: /usr/local/sbin/keyspilli-backup-runner
        owner: root
        group: root
        mode: '0750'
      tags: [backup]

    - name: Install backup systemd service
      ansible.builtin.template:
        src: templates/keyspilli-backup.service.j2
        dest: /etc/systemd/system/keyspilli-backup.service
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd
      tags: [backup]

    - name: Install backup systemd timer
      ansible.builtin.template:
        src: templates/keyspilli-backup.timer.j2
        dest: /etc/systemd/system/keyspilli-backup.timer
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd
      tags: [backup]

    - name: Enable and start nightly backup timer
      ansible.builtin.systemd:
        name: keyspilli-backup.timer
        enabled: true
        state: started
        daemon_reload: true
      tags: [backup]

    - name: Free disk by pruning all unused Docker images
      # `docker_prune(images: true)` only removes dangling layers. Immutable
      # GHCR tags from previous deploys (and a failed pull) remain tagged but
      # unused, eventually filling the small VPS disk before Compose can be
      # rendered. Running the all-images prune while the current containers
      # are still up keeps their image IDs available for rollback, and the
      # next task re-tags those IDs explicitly.
      ansible.builtin.command: docker image prune --all --force
      register: pruned
      changed_when: "'Total reclaimed space: 0B' not in (pruned.stdout | default(''))"
      tags: [deploy]

    - name: Capture current Keyspilli containers before deploy
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop:
        - "{{ container_name }}"
        - "{{ worker_container_name }}"
      register: current_containers
      check_mode: false
      tags: [deploy, rollback]

    - name: Remember previous deployments for rollback
      ansible.builtin.set_fact:
        previous_web_exists: "{{ current_containers.results[0].exists | default(false) }}"
        previous_web_image_id: "{{ current_containers.results[0].container.Image | default('') }}"
        previous_worker_exists: "{{ current_containers.results[1].exists | default(false) }}"
        previous_worker_image_id: "{{ current_containers.results[1].container.Image | default('') }}"
        previous_app_version: >-
          {{
            (
              current_containers.results[0].container.Config.Env
              | default([])
              | select('match', '^VERSION=')
              | list
              | first
              | default('VERSION=unknown')
            )
            | regex_replace('^VERSION=', '')
            | default('unknown', true)
          }}
      tags: [deploy, rollback]

    - name: Tag previous images for rollback
      ansible.builtin.command:
        argv:
          - docker
          - tag
          - "{{ item.image_id }}"
          - "{{ item.rollback }}"
      loop:
        - image_id: "{{ previous_web_image_id }}"
          rollback: "{{ rollback_image }}"
          exists: "{{ previous_web_exists }}"
        - image_id: "{{ previous_worker_image_id }}"
          rollback: "{{ rollback_worker_image }}"
          exists: "{{ previous_worker_exists }}"
      when:
        - item.exists | bool
        - item.image_id | length > 0
      changed_when: true
      check_mode: false
      tags: [deploy, rollback]

    - name: Deploy candidate images and verify exact public version
      block:
        - name: Pull requested GHCR images
          community.docker.docker_image:
            name: "{{ item }}"
            source: pull
            force_source: true
          loop:
            - "{{ docker_image }}"
            - "{{ worker_image }}"
          tags: [deploy]

        - name: Render production Compose file
          ansible.builtin.template:
            src: templates/compose.production.yml.j2
            dest: "{{ app_dir }}/compose.production.yml"
            owner: deploy
            group: deploy
            mode: '0644'
          tags: [deploy]

        - name: Start Keyspilli with Docker Compose
          community.docker.docker_compose_v2:
            project_src: "{{ app_dir }}"
            files:
              - compose.production.yml
            state: present
            recreate: always
            remove_orphans: true
            wait: true
            wait_timeout: 120
          tags: [deploy]

        - name: Wait for local Keyspilli health endpoint
          ansible.builtin.uri:
            url: "{{ health_url }}"
            return_content: true
            status_code: 200
            timeout: 5
          register: local_health
          until: >-
            local_health.status == 200
            and (local_health.json.status | default('')) == 'healthy'
            and (local_health.json.version | default('')) == app_version
          retries: 12
          delay: 5
          failed_when: false
          tags: [verify]

        - name: Fail if local health endpoint is not healthy
          ansible.builtin.fail:
            msg: "Local health check failed for {{ health_url }}: {{ local_health }}"
          when: >-
            local_health.status | default(0) != 200
            or (local_health.json.status | default('')) != 'healthy'
            or (local_health.json.version | default('')) != app_version
          tags: [verify]

        - name: Manage Caddy reverse proxy block
          ansible.builtin.blockinfile:
            path: /etc/caddy/Caddyfile
            marker: "# {mark} ANSIBLE MANAGED - {{ caddy_marker_name }}"
            block: |
              {{ app_domain }} {
                # Caddy's default response matcher excludes the vendor
                # MusicXML MIME, so keep the standard encodings and add it
                # explicitly for /api/v1/sheet responses.
                encode zstd gzip {
                  match {
                    header Content-Type application/atom+xml*
                    header Content-Type application/eot*
                    header Content-Type application/font*
                    header Content-Type application/geo+json*
                    header Content-Type application/graphql+json*
                    header Content-Type application/javascript*
                    header Content-Type application/json*
                    header Content-Type application/ld+json*
                    header Content-Type application/manifest+json*
                    header Content-Type application/opentype*
                    header Content-Type application/otf*
                    header Content-Type application/rss+xml*
                    header Content-Type application/truetype*
                    header Content-Type application/ttf*
                    header Content-Type application/vnd.api+json*
                    header Content-Type application/vnd.ms-fontobject*
                    header Content-Type application/vnd.recordare.musicxml+xml*
                    header Content-Type application/wasm*
                    header Content-Type application/x-httpd-cgi*
                    header Content-Type application/x-javascript*
                    header Content-Type application/x-opentype*
                    header Content-Type application/x-otf*
                    header Content-Type application/x-perl*
                    header Content-Type application/x-protobuf*
                    header Content-Type application/x-ttf*
                    header Content-Type application/xhtml+xml*
                    header Content-Type application/xml*
                    header Content-Type font/*
                    header Content-Type image/svg+xml*
                    header Content-Type image/vnd.microsoft.icon*
                    header Content-Type image/x-icon*
                    header Content-Type multipart/bag*
                    header Content-Type multipart/mixed*
                    header Content-Type text/*
                  }
                }
                reverse_proxy {{ app_bind_address }}:{{ app_host_port }} {
                  header_up X-Real-IP {remote_host}
                  header_up X-Forwarded-For {remote_host}
                }
              }
            backup: true
            mode: '0644'
            validate: caddy validate --config %s --adapter caddyfile
          notify: Reload Caddy
          tags: [caddy]

        - name: Validate Caddy configuration
          ansible.builtin.command: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          changed_when: false
          tags: [caddy, verify]

        - name: Apply Caddy configuration before public verification
          ansible.builtin.meta: flush_handlers
          tags: [caddy]

        - name: Verify public deployment version
          ansible.builtin.uri:
            url: "{{ public_health_url }}"
            return_content: true
            status_code: 200
            timeout: 10
          register: public_health
          until: >-
            public_health.status == 200
            and (public_health.json.status | default('')) == 'healthy'
            and (public_health.json.version | default('')) == app_version
          retries: 12
          delay: 5
          failed_when: false
          delegate_to: localhost
          become: false
          tags: [verify]

        - name: Fail if public deployment version is not healthy
          ansible.builtin.fail:
            msg: "Public health check failed for {{ public_health_url }}: {{ public_health }}"
          when: >-
            public_health.status | default(0) != 200
            or (public_health.json.status | default('')) != 'healthy'
            or (public_health.json.version | default('')) != app_version
          tags: [verify]

        - name: Verify public simplify PDF export signature
          ansible.builtin.shell: |
            set -eu
            tmp="$(mktemp)"
            trap 'rm -f "$tmp"' EXIT
            curl --fail --silent --show-error --location --max-time 180 \
              --range 0-4 --header 'Accept: application/pdf' \
              --output "$tmp" \
              "https://{{ app_domain }}/api/song/{{ pdf_smoke_song_id }}/export?type=pdf&layout=simplify"
            test "$(LC_ALL=C head -c 5 "$tmp")" = '%PDF-'
          changed_when: false
          delegate_to: localhost
          become: false
          tags: [verify]

        - name: Verify public classic PDF export signature
          ansible.builtin.shell: |
            set -eu
            tmp="$(mktemp)"
            trap 'rm -f "$tmp"' EXIT
            curl --fail --silent --show-error --location --max-time 180 \
              --range 0-4 --header 'Accept: application/pdf' \
              --output "$tmp" \
              "https://{{ app_domain }}/api/song/{{ pdf_smoke_song_id }}/export?type=pdf&layout=classic"
            test "$(LC_ALL=C head -c 5 "$tmp")" = '%PDF-'
          changed_when: false
          delegate_to: localhost
          become: false
          tags: [verify]

        - name: Report successful deployment
          ansible.builtin.debug:
            msg:
              - "Keyspilli deployed at {{ public_health_url }}"
              - "Web container: {{ container_name }} ({{ docker_image }})"
              - "Worker container: {{ worker_container_name }} ({{ worker_image }})"
              - "Version: {{ app_version }}"
          tags: [verify]

      rescue:
        - name: Fail when rollback images are unavailable
          ansible.builtin.fail:
            msg: "Deployment failed and no previous image was available for rollback: {{ ansible_failed_result | default({}) }}"
          when: >-
            not (previous_web_exists | bool)
            or (previous_web_image_id | length == 0)
            or not (previous_worker_exists | bool)
            or (previous_worker_image_id | length == 0)
          tags: [rollback]

        - name: Report rollback start
          ansible.builtin.debug:
            msg:
              - "Candidate deployment failed; restoring previous images."
              - "Previous version: {{ previous_app_version }}"
              - "Failure: {{ ansible_failed_result | default({}) }}"
          tags: [rollback]

        - name: Render rollback Compose file
          ansible.builtin.template:
            src: templates/compose.production.yml.j2
            dest: "{{ app_dir }}/compose.production.yml"
            owner: deploy
            group: deploy
            mode: '0644'
          vars:
            compose_image: "{{ rollback_image }}"
            compose_worker_image: "{{ rollback_worker_image }}"
            compose_app_version: "{{ previous_app_version }}"
          tags: [rollback]

        - name: Restore previous Keyspilli containers
          community.docker.docker_compose_v2:
            project_src: "{{ app_dir }}"
            files:
              - compose.production.yml
            state: present
            recreate: always
            remove_orphans: true
            wait: true
            wait_timeout: 120
          tags: [rollback]

        - name: Wait for local rollback health endpoint
          ansible.builtin.uri:
            url: "{{ health_url }}"
            return_content: true
            status_code: 200
            timeout: 5
          register: rollback_local_health
          until: >-
            rollback_local_health.status == 200
            and (rollback_local_health.json.status | default('')) == 'healthy'
            and (
              previous_app_version == 'unknown'
              or (rollback_local_health.json.version | default('')) == previous_app_version
            )
          retries: 12
          delay: 5
          failed_when: false
          tags: [rollback, verify]

        - name: Fail if rollback is not healthy
          ansible.builtin.fail:
            msg: "Rollback health check failed: {{ rollback_local_health }}"
          when: >-
            rollback_local_health.status | default(0) != 200
            or (rollback_local_health.json.status | default('')) != 'healthy'
          tags: [rollback, verify]

        - name: Report rollback result
          ansible.builtin.debug:
            msg: "Rolled back to {{ previous_app_version }} on {{ health_url }}"
          tags: [rollback]

        - name: Fail CI after a successful rollback
          # The rollback restores service but the candidate deploy itself
          # failed. Exit non-zero so CI reports the real outcome instead of
          # silently marking a rolled-back deployment as green.
          ansible.builtin.fail:
            msg: >-
              Candidate deploy failed and was rolled back to
              {{ previous_app_version }}. See rescue failure above:
              {{ ansible_failed_result | default({}) }}

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      listen: "Reload systemd"
      tags: [backup]

    - name: Reload Caddy
      ansible.builtin.systemd:
        name: caddy
        state: reloaded
      become: true
      listen: "Reload Caddy"
      tags: [caddy]
