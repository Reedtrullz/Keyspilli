---
# Example inventory. The real deploy/inventory/hosts.yml is gitignored.
#
# Local operators: copy this file to deploy/inventory/hosts.yml and replace
# the placeholders (or render it with deploy/render-inventory.py using
# KEYSPILLI_VPS_HOST / KEYSPILLI_VPS_USER / KEYSPILLI_VPS_SSH_KEY).
# CI renders it from the KEYSPILLI_VPS_HOST secret and the optional
# KEYSPILLI_VPS_USER variable before running the playbook.
all:
  children:
    keyspilli:
      hosts:
        keyspilli_vps:
          ansible_host: VPS_HOST
          ansible_user: VPS_USER
          ansible_ssh_private_key_file: VPS_SSH_KEY
          ansible_ssh_common_args: "-o PreferredAuthentications=publickey"
          ansible_ssh_extra_args: "-o IdentitiesOnly=yes -o IdentityAgent=none"
          ansible_python_interpreter: /usr/bin/python3
          app_domain: keys.reidar.tech
          app_host_port: 3008
          app_bind_address: 127.0.0.1
