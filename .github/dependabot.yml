# Version updates: weekly npm, monthly pip and GitHub Actions; majors are
# ignored here and taken deliberately.
#
# Security updates are separate from this file: they need "Dependabot alerts"
# and "Dependabot security updates" turned on in Settings -> Code security.
# Once enabled, the security-updates groups below batch all security fixes
# for an ecosystem into one PR, independent of the version-update PR limits.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /services/transcribe
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Offline music evidence retains Python 3.11 and NumPy 1.26.4.
      # SciPy 1.18 requires Python >=3.12 and NumPy >=2; upgrade them together.
      - dependency-name: scipy
        versions: [">=1.18.0"]
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
