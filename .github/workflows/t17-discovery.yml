name: Keyspilli Task 17 discovery

on:
  push:
    branches:
      - codex/keyspilli-t17-measure-20261108

permissions:
  contents: read

env:
  BASELINE_COMMIT: edb7d0c7b56d9f7a0e020893cf363a05b18a681d
  NODE_VERSION: 22.22.3
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  discovery:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: harness

      - name: Check out accepted common baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_COMMIT }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Verify exact source
        run: |
          test "$(git -C source rev-parse HEAD)" = "$BASELINE_COMMIT"
          test "$(git -C source status --porcelain)" = ""
          df -B1 --output=avail,target -- "$RUNNER_TEMP" "$GITHUB_WORKSPACE"

      - name: Install and build the exact baseline
        working-directory: source
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Playwright Chromium
        working-directory: source/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unscored discovery
        run: >
          node harness/deploy/t17-discovery.mjs
          "$GITHUB_WORKSPACE/source"
          "$GITHUB_WORKSPACE/harness"
          "$RUNNER_TEMP/t17-discovery"

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t17-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/t17-discovery
          if-no-files-found: error
          retention-days: 90
