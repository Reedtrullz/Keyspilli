name: KU Batch 1 isolated runtime
on:
  push:
    branches: ['codex/ku-batch1-runtime']
permissions:
  contents: read
jobs:
  stock-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '03fdea5210e4a769afa4853e6b498833443147b5'
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.3'
      - name: Install the qualified test runtime
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fluidsynth timgm6mb-soundfont
          npx playwright install --with-deps chromium
      - name: Prepare and relocate a complete stock-piano delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/ku-batch1-ci
          python3 - <<'PY'
          import importlib.util, json, subprocess, hashlib
          from pathlib import Path
          s=importlib.util.spec_from_file_location('checker','scripts/check-keyspilli-plugin.py')
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          root=Path('output/ku-batch1-ci');root.joinpath('input.mid').write_bytes(m.synthetic_midi())
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          root.joinpath('provenance.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'node':subprocess.check_output(['node','--version'],text=True).strip(),'renderer':subprocess.check_output(['fluidsynth','--version'],text=True).strip(),'rendererSha256':h('/usr/bin/fluidsynth'),'bankSha256':h('/usr/share/sounds/sf2/TimGM6mb.sf2'),'inputSha256':h(root/'input.mid'),'source':'existing self-authored checker control; not musical gold','physicalListening':False},indent=2))
          PY
          node --import tsx apps/web/scripts/prepare-song.mts output/ku-batch1-ci/input.mid output/ku-batch1-ci/prepared 'Stock piano delivery control' 'Self-authored software control' --previews --soundfont /usr/share/sounds/sf2/TimGM6mb.sf2 --executable /usr/bin/fluidsynth > output/ku-batch1-ci/prepare.log 2>&1
          cp -a output/ku-batch1-ci/prepared/delivery output/ku-batch1-ci/portable
          node --import tsx apps/web/scripts/deliver-song.mts verify output/ku-batch1-ci/portable > output/ku-batch1-ci/verify.log 2>&1
      - name: Exercise fresh browser playback and every local download link
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8787 --bind 127.0.0.1 --directory output/ku-batch1-ci/portable > output/ku-batch1-ci/http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          cat > output/ku-batch1-ci/browser-check.mts <<'TS'
          import {chromium} from '@playwright/test';
          import {readFileSync,writeFileSync} from 'node:fs';
          const root='output/ku-batch1-ci',host='http://127.0.0.1:8787/';
          const m=JSON.parse(readFileSync(root+'/portable/manifest.json','utf8'));
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1120,height:1000}}),page=await ctx.newPage();
          const evidence:any={freshContext:true,browser:browser.version(),physicalListening:false,status:'failed',checks:[]};
          try {
            await page.goto(host+'index.html');
            if(await page.locator('audio').count()!==2)throw Error('two mode players required');
            for(const [i,mode] of ['original','chords'].entries()){
              const audio=page.locator('audio').nth(i);
              await audio.evaluate(a=>{(a as HTMLAudioElement).load();});
              await page.waitForFunction(i=>(document.querySelectorAll('audio')[i] as HTMLAudioElement).readyState>=1,i);
              const seconds=await audio.evaluate(a=>(a as HTMLAudioElement).duration);
              if(Math.abs(seconds-m.modes[mode].render.wav.durationSeconds)>0.001)throw Error('PCM/browser clock disagreement');
              await audio.click({position:{x:20,y:25}});
              await page.waitForFunction(i=>{const a=document.querySelectorAll('audio')[i] as HTMLAudioElement;return !a.paused&&a.currentTime>0.05&&!a.error;},i);
              const playback=await audio.evaluate(a=>{const v=a as HTMLAudioElement;const t=v.currentTime;v.pause();return t;});
              evidence.checks.push({mode,seconds,advancedToSeconds:playback});
            }
            const links=await page.locator('a').evaluateAll(nodes=>nodes.map(n=>(n as HTMLAnchorElement).href));
            for(const url of links){if(!url.startsWith(host))throw Error('external link');const r=await ctx.request.get(url);if(!r.ok())throw Error('broken download '+url);}
            if(m.status!=='complete-provisional'||m.modes.chords.difficultyScope!=='shared-advanced-derived')throw Error('incorrect delivery scope');
            evidence.workingLinks=links.length;evidence.warnings={original:m.modes.original.warnings,chords:m.modes.chords.warnings};
            await page.screenshot({path:root+'/browser.png',fullPage:true});evidence.status='passed';
          }finally{writeFileSync(root+'/browser-check.json',JSON.stringify(evidence,null,2));await browser.close();}
          TS
          node --import tsx output/ku-batch1-ci/browser-check.mts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ku-batch1-stock-browser-03fdea
          path: |
            output/ku-batch1-ci/portable/
            output/ku-batch1-ci/*.json
            output/ku-batch1-ci/*.log
            output/ku-batch1-ci/*.png
            output/ku-batch1-ci/*.mts
          retention-days: 7
          if-no-files-found: warn
