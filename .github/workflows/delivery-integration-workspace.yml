name: Delivery integration workspace
on:
  push:
    branches: [codex/delivery-workspace-bootstrap]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.3'
      - name: Retain the nested dependency omitted by the initial root-only archive
        run: |
          git checkout -b main-update 200b3436092e667b9f4d19d36034acbd97ea6148
          npm ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/workspace-repair"
          tar -czf "$RUNNER_TEMP/workspace-repair/nested-dependencies.tar.gz" packages/engrave/node_modules
          git bundle create "$RUNNER_TEMP/workspace-repair/main-update.bundle" main-update ^e94014e2bd4c8cf31242820c9676e3d70e0d2c7e
          cp package-lock.json "$RUNNER_TEMP/workspace-repair/package-lock.json"
          cd "$RUNNER_TEMP/workspace-repair"
          sha256sum nested-dependencies.tar.gz main-update.bundle package-lock.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyspilli-nested-runtime-and-main-update
          path: ${{ runner.temp }}/workspace-repair/
          if-no-files-found: error
          retention-days: 7
