name: CI / Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: 22.22.3
  IMAGE_NAME: ghcr.io/reedtrullz/keyspilli
  WORKER_IMAGE_NAME: ghcr.io/reedtrullz/keyspilli-worker
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: keyspilli-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Automatic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch seed catalog (public-domain MIDI)
        run: npx tsx packages/catalog/scripts/fetch-seed.ts

      - name: Build catalog pipeline (db + artifacts)
        run: npm run pipeline

      - name: Verify catalog playability
        run: npm run verify-catalog

      - name: Calibration drift check
        run: npm run calibrate

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: End-to-end tests
        run: npx playwright test
        working-directory: apps/web

  build-and-push:
    name: Build and push images to GHCR
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 30
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Compute immutable image tag
        id: image
        run: |
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            VERSION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: services/transcribe/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WORKER_IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.WORKER_IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS with Ansible
    runs-on: ubuntu-24.04
    needs:
      - checks
      - build-and-push
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://keys.reidar.tech

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Ansible
        shell: bash
        run: |
          python3 -m venv .ansible-venv
          . .ansible-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ansible==12.3.0
          ansible-galaxy collection install -r deploy/requirements.yml
          echo "$PWD/.ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Configure SSH key
        shell: bash
        env:
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY || secrets.VPS_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa_racknerd
          chmod 600 ~/.ssh/id_rsa_racknerd

          normalize_host_keys() {
            sed -e 's/\r$//' -e '/^[[:space:]]*$/d' -e '/^[[:space:]]*#/d' | sort -u
          }

          expected_host_key="$(printf '%s\n' "${VPS_SSH_HOST_KEY:-}" | normalize_host_keys)"
          if [[ -z "$expected_host_key" ]]; then
            echo "VPS_SSH_HOST_KEY repository variable or secret must be set before production deploy." >&2
            exit 1
          fi

          scanned_host_key="$(ssh-keyscan -T 10 -t ed25519 198.23.137.16 2>/dev/null | normalize_host_keys)"
          if [[ -z "$scanned_host_key" ]]; then
            echo "Unable to scan VPS SSH host key." >&2
            exit 1
          fi

          if [[ "$scanned_host_key" != "$expected_host_key" ]]; then
            echo "VPS SSH host key mismatch; refusing to update known_hosts." >&2
            exit 1
          fi

          printf '%s\n' "$expected_host_key" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa_racknerd -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@198.23.137.16 'echo "SSH OK"'

      - name: Deploy immutable image tags
        shell: bash
        env:
          APP_VERSION: ${{ github.sha }}
          ANSIBLE_CONFIG: deploy/ansible.cfg
        run: |
          ansible-playbook \
            -i deploy/inventory/hosts.yml \
            deploy/playbook.yml \
            -e "docker_image=${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}" \
            -e "worker_image=${{ env.WORKER_IMAGE_NAME }}:${{ needs.build-and-push.outputs.tag }}"

      - name: Verify public deployment version
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          expected = os.environ['GITHUB_SHA']
          url = 'https://keys.reidar.tech/api/health'
          last = None
          for _ in range(12):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          'Accept': 'application/json',
                          'User-Agent': 'Keyspilli CI deploy verifier',
                      },
                  )
                  with urllib.request.urlopen(request, timeout=10) as response:
                      last = response.read().decode('utf-8')
                      payload = json.loads(last)
                      if payload.get('status') == 'healthy' and payload.get('version') == expected:
                          print(json.dumps(payload, indent=2))
                          sys.exit(0)
              except Exception as exc:
                  last = repr(exc)
              time.sleep(5)
          print(f'Public health check did not expose expected version {expected}. Last response: {last}', file=sys.stderr)
          sys.exit(1)
