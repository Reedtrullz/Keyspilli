name: CI / Deploy

on:
  pull_request:
    branches:
      - main
      - codex/keyspilli-listening-review
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: "Deployment retries preserve production song data; rebuilding requires explicit scope"
        required: true
        default: deploy_only
        type: choice
        options:
          - deploy_only
          - rebuild_target
          - rebuild_all
      promote_reviewed:
        description: "Skip automatic checks only after the exact reviewed main check and manifest are pinned"
        required: false
        default: false
        type: boolean
      rebuild_confirmation:
        description: "Only for rebuild_all: type REBUILD_ALL_CATALOG"
        required: false
        default: ""
        type: string
      rebuild_base_id:
        description: "Optional single base id to rebuild (leave blank for the full catalog)"
        required: false
        default: ""
        type: string
      rebuild_transcription_mode:
        description: "YouTube transcription path for a targeted rebuild"
        required: false
        default: "strict"
        type: choice
        options:
          - strict
          - preserve-melody

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.3
  IMAGE_NAME: ghcr.io/reedtrullz/keyspilli
  WORKER_IMAGE_NAME: ghcr.io/reedtrullz/keyspilli-worker
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: keyspilli-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ github.event.inputs.promote_reviewed == 'true' && 'Promotion prerequisites' || 'Automatic checks' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.promote_reviewed == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate dispatch operation before release work
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          REBUILD_BASE_ID: ${{ inputs.rebuild_base_id }}
          REBUILD_TRANSCRIPTION_MODE: ${{ inputs.rebuild_transcription_mode }}
          REBUILD_CONFIRMATION: ${{ inputs.rebuild_confirmation }}
        run: python3 deploy/validate-release-operation.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Runs before fetch-seed/pipeline: the pipeline regenerates
      # catalog/manifest.json, and the map integrity check must see the
      # committed manifest rather than the regenerated subset.
      - name: Audit song section maps
        run: npm run audit:sections -w @keyspilli/catalog

      - name: Fetch seed catalog (public-domain MIDI)
        run: npx tsx packages/catalog/scripts/fetch-seed.ts

      - name: Build catalog pipeline (db + artifacts)
        run: npm run pipeline

      - name: Verify catalog playability
        run: npm run verify-catalog

      - name: Verify chord sources
        run: npm run verify-chord-sources -- --require-catalog

      - name: Calibration drift check
        run: npm run calibrate

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium webkit
        working-directory: apps/web

      - name: Verify Playwright Chromium launch
        run: node scripts/verify-playwright-runtime.mjs
        working-directory: apps/web

      - name: Validate private edge boundary
        run: bash deploy/test/access-boundary.sh

      - name: Python ops fixtures and verifier tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 deploy/test/test-live-verifier.py
          sudo python3 deploy/test/test-backup.py
          sudo python3 deploy/test/test-storage.py
          python3 deploy/test/test-replicate-backup.py
          node deploy/test/restore-app-verifier.mjs
          python3 deploy/test/test-release-operation.py
          python3 scripts/test_check_music_release.py
          python3 deploy/test/test-worker-queue.py
          python3 -m unittest \
            deploy.test_worker_resources.WorkerResourceBoundary.test_native_limits_are_bounded_without_shell_commands \
            deploy.test_worker_resources.WorkerResourceBoundary.test_cleanup_failure_cannot_claim_success
          bash deploy/test/ops-check.sh
          transcribe_test_venv=.transcribe-test-venv
          trap 'rm -rf "$transcribe_test_venv"' EXIT
          python3 -m venv "$transcribe_test_venv"
          "$transcribe_test_venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r services/transcribe/requirements-test.txt
          "$transcribe_test_venv/bin/python" -m unittest \
            services/transcribe/test/test_tutorial_keys.py \
            services/transcribe/test/test_tutorial_timing.py \
            services/transcribe/test/test_separate_stems.py

      - name: End-to-end tests
        run: |
          node scripts/verify-e2e-routing.mjs
          npx playwright test
          npx playwright test --config=playwright.scratch.config.ts
          npx playwright test --config=playwright.player-ui.config.ts
          npx playwright test --config=playwright.roadmap.config.ts
        working-directory: apps/web

      - name: Verify public seed backup in the current isolated web image
        if: github.event_name == 'pull_request'
        timeout-minutes: 12
        env:
          RESTORE_REVISION: ${{ github.sha }}
        run: |
          test "$(df -B1 --output=avail . | tail -1)" -ge 32212254720
          pull_ok=0
          for attempt in 1 2 3 4 5; do
            if docker pull public.ecr.aws/docker/library/node:22.22.3-bookworm-slim; then
              pull_ok=1
              break
            fi
            sleep $((attempt * 15))
          done
          test "$pull_ok" = 1
          docker build -f apps/web/Dockerfile --build-arg VERSION="$RESTORE_REVISION" -t keyspilli-restore:ci .
          export KEYSPILLI_BACKUP_WEB_IMAGE_ID="$(docker image inspect keyspilli-restore:ci --format '{{.Id}}')"
          export KEYSPILLI_BACKUP_WEB_REVISION="$RESTORE_REVISION"
          export RESTORE_SONG_ID="$(node --import tsx --input-type=module -e '
            import {listSongs, getDb} from "./packages/catalog/src/db.ts";
            const song = listSongs({publicOnly: true, limit: 200}).filter(s => s.hasSheetXml === 1 && s.difficulty === "easy").sort((a,b) => a.duration-b.duration)[0];
            if (!song) throw new Error("No public seed export fixture");
            console.log(song.id); getDb().close();
          ')"
          python3 - <<'PY'
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          source = Path("data").resolve()
          for name in ("manifest.json", "learner-review.json"):
              shutil.copyfile(Path("catalog") / name, source / name)
          with tempfile.TemporaryDirectory(prefix="keyspilli-ci-restore-") as directory:
              root = Path(directory)
              env = {**os.environ, "KEYSPILLI_DATA_DIR": str(source), "KEYSPILLI_BACKUP_DIR": str(root / "backups")}
              subprocess.run(["bash", "deploy/backup.sh"], env=env, check=True, timeout=60)
              manifests = list((root / "backups").glob("backup-manifest-*.json"))
              assert len(manifests) == 1
              subprocess.run(["bash", "deploy/restore-drill.sh", str(manifests[0]), str(root / "restored"),
                              "--verify-app", env["KEYSPILLI_BACKUP_WEB_IMAGE_ID"], env["RESTORE_REVISION"],
                              env["RESTORE_SONG_ID"]], check=True, timeout=300)
              report = json.loads((root / "restored" / "restore-report.json").read_text())
              assert report["applicationVerification"] == "passed"
              assert report["restoredRevision"] == env["RESTORE_REVISION"]
              assert report["webImageId"] == env["KEYSPILLI_BACKUP_WEB_IMAGE_ID"]
              for name in ("manifest.json", "learner-review.json"):
                  assert (root / "restored" / "runtime" / name).read_bytes() == (source / name).read_bytes()
          assert not subprocess.check_output(["docker", "ps", "-aq", "--filter", "name=^/keyspilli-restore-"], text=True).strip()
          print("Current web image restored the public seed pair; policy bytes and owned-container cleanup verified")
          PY

  release-readiness:
    name: Reviewed music release readiness
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 5
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.promote_reviewed == true &&
      inputs.operation == 'deploy_only' &&
      needs.checks.result == 'skipped'
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Read exact-head check results from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" --jq '.check_runs[]' > "$RUNNER_TEMP/check-runs.jsonl"
          jq -s '{check_runs:.}' "$RUNNER_TEMP/check-runs.jsonl" > "$RUNNER_TEMP/music-checks.json"
      - name: Require reviewed four-gate manifest before publication or deployment
        env:
          KEYSPILLI_MUSIC_RELEASE_MANIFEST_JSON: ${{ vars.KEYSPILLI_MUSIC_RELEASE_MANIFEST_JSON }}
          RELEASE_OPERATION: ${{ inputs.operation || 'deploy_only' }}
        run: |
          test "$RELEASE_OPERATION" = deploy_only
          python3 scripts/check-music-release.py --commit "$GITHUB_SHA" --checks "$RUNNER_TEMP/music-checks.json"

  build-and-push:
    name: Build and push images to GHCR
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    needs: [checks, release-readiness]
    timeout-minutes: 30
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.promote_reviewed == true &&
      inputs.operation == 'deploy_only' &&
      needs.checks.result == 'skipped' &&
      needs.release-readiness.result == 'success'

    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
      web_bytes: ${{ steps.sizes.outputs.web_bytes }}
      worker_bytes: ${{ steps.sizes.outputs.worker_bytes }}
      web_digest: ${{ steps.web.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Compute immutable image tag
        id: image
        run: |
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        id: web
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            VERSION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha
          # Keep the web cache bounded: mode=min avoids exporting build-only
          # Chromium/Next intermediate layers, and a timeout prevents a slow
          # GHA cache backend from holding the release job indefinitely.
          # Image publication remains authoritative if cache export fails.
          cache-to: type=gha,mode=min,timeout=120s,ignore-error=true

      - name: Build and push worker image
        id: worker
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: services/transcribe/Dockerfile.tutorial
          target: worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WORKER_IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.WORKER_IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          # Preserve worker dependency layers separately from the web cache.
          # A bounded final-image export avoids rebuilding large apt/pip
          # layers on every release while keeping publication authoritative.
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=min,timeout=120s,ignore-error=true

      - name: Attest uncompressed release sizes before VPS admission
        id: sizes
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os, shutil, subprocess
          gib = 1024 ** 3
          driver = subprocess.check_output(["docker", "info", "--format", "{{.Driver}}"], text=True).strip()
          if driver != "overlay2":
              raise SystemExit("size admission requires classic overlay2 uncompressed accounting; unsupported runner store")
          # Release runner only: no VPS pull/extraction until this succeeds.
          for role, repo, ceiling in (("web", os.environ["IMAGE_NAME"], 2*gib),
                                     ("worker", os.environ["WORKER_IMAGE_NAME"], 4*gib)):
              if shutil.disk_usage("/").free < 3*ceiling + 6*gib:
                  raise SystemExit("release runner lacks disk headroom for size admission")
              ref = repo + "@" + os.environ[role.upper() + "_DIGEST"]
              subprocess.run(["docker", "pull", ref], check=True, timeout=900)
              size = int(subprocess.check_output(["docker", "image", "inspect", "--format", "{{.Size}}", ref]))
              if not 0 < size <= ceiling:
                  raise SystemExit(f"{role} exceeds uncompressed release ceiling")
              print(f"{role}: digest={ref} ciBytes={size} ceilingBytes={ceiling}", flush=True)
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"{role}_bytes={size}\n")
          PY

  deploy:
    name: Deploy to VPS with Ansible
    runs-on: ubuntu-24.04
    needs:
      - checks
      - build-and-push
      - release-readiness
    timeout-minutes: 20
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.promote_reviewed == true &&
      inputs.operation == 'deploy_only' &&
      needs.checks.result == 'skipped' &&
      needs.release-readiness.result == 'success' &&
      needs.build-and-push.result == 'success'
    environment:
      name: production
      url: https://keys.reidar.tech

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Ansible
        shell: bash
        run: |
          python3 -m venv .ansible-venv
          . .ansible-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ansible==12.3.0
          python deploy/test_worker_resources.py
          ansible-galaxy collection install -r deploy/requirements.yml
          echo "$PWD/.ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Configure SSH key
        shell: bash
        env:
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY || secrets.VPS_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa_racknerd
          chmod 600 ~/.ssh/id_rsa_racknerd

          normalize_host_keys() {
            sed -e 's/\r$//' -e '/^[[:space:]]*$/d' -e '/^[[:space:]]*#/d' | sort -u
          }

          expected_host_key="$(printf '%s\n' "${VPS_SSH_HOST_KEY:-}" | normalize_host_keys)"
          if [[ -z "$expected_host_key" ]]; then
            echo "VPS_SSH_HOST_KEY repository variable or secret must be set before production deploy." >&2
            exit 1
          fi

          scanned_host_key="$(ssh-keyscan -T 10 -t ed25519 198.23.137.16 2>/dev/null | normalize_host_keys)"
          if [[ -z "$scanned_host_key" ]]; then
            echo "Unable to scan VPS SSH host key." >&2
            exit 1
          fi

          if [[ "$scanned_host_key" != "$expected_host_key" ]]; then
            echo "VPS SSH host key mismatch; refusing to update known_hosts." >&2
            exit 1
          fi

          printf '%s\n' "$expected_host_key" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa_racknerd -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@198.23.137.16 'echo "SSH OK"'

      - name: Deploy immutable image tags
        shell: bash
        env:
          APP_VERSION: ${{ github.sha }}
          ANSIBLE_CONFIG: deploy/ansible.cfg
          KEYSPILLI_API_TOKEN: ${{ secrets.KEYSPILLI_API_TOKEN }}
          KEYSPILLI_ACCESS_USERNAME: ${{ secrets.KEYSPILLI_ACCESS_USERNAME }}
          KEYSPILLI_ACCESS_PASSWORD: ${{ secrets.KEYSPILLI_ACCESS_PASSWORD }}
          # Optional: a trusted non-credential proxy endpoint and an absolute
          # cookie-file path that already exists on the VPS. The playbook
          # mounts the latter read-only; cookie contents never enter CI.
          KEYSPILLI_YT_PROXY: ${{ vars.KEYSPILLI_YT_PROXY || secrets.KEYSPILLI_YT_PROXY }}
          KEYSPILLI_YT_COOKIES_PATH: ${{ vars.KEYSPILLI_YT_COOKIES_PATH || secrets.KEYSPILLI_YT_COOKIES_PATH }}
        run: |
          ansible-playbook \
            -i deploy/inventory/hosts.yml \
            deploy/playbook.yml \
            -e "docker_image=${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}" \
            -e "worker_image=${{ env.WORKER_IMAGE_NAME }}:${{ needs.build-and-push.outputs.tag }}" \
            -e "keyspilli_web_bytes=${{ needs.build-and-push.outputs.web_bytes }}" \
            -e "keyspilli_worker_bytes=${{ needs.build-and-push.outputs.worker_bytes }}" \
            -e "keyspilli_web_digest=${{ needs.build-and-push.outputs.web_digest }}" \
            -e "keyspilli_worker_digest=${{ needs.build-and-push.outputs.worker_digest }}"

      - name: Verify public deployment version
        shell: bash
        env:
          KEYSPILLI_ACCESS_USERNAME: ${{ secrets.KEYSPILLI_ACCESS_USERNAME }}
          KEYSPILLI_ACCESS_PASSWORD: ${{ secrets.KEYSPILLI_ACCESS_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          expected = os.environ['GITHUB_SHA']
          url = 'https://keys.reidar.tech/api/health'
          anonymous_ok = False
          for _ in range(12):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          'Accept': 'application/json',
                          'User-Agent': 'Keyspilli CI deploy verifier',
                      },
                  )
                  with urllib.request.urlopen(request, timeout=10) as response:
                      if response.status != 401:
                          raise RuntimeError(f'anonymous health returned HTTP {response.status}')
              except urllib.error.HTTPError as exc:
                  if exc.code == 401:
                      anonymous_ok = True
                      break
              except Exception:
                  pass
              time.sleep(5)

          if not anonymous_ok:
              print('Anonymous public health check did not return HTTP 401.', file=sys.stderr)
              sys.exit(1)

          credentials = f"{os.environ['KEYSPILLI_ACCESS_USERNAME']}:{os.environ['KEYSPILLI_ACCESS_PASSWORD']}".encode()
          auth = base64.b64encode(credentials).decode()
          last_error = None
          for _ in range(12):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          'Accept': 'application/json',
                          'User-Agent': 'Keyspilli CI deploy verifier',
                          'Authorization': f'Basic {auth}',
                      },
                  )
                  with urllib.request.urlopen(request, timeout=10) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                      if payload.get('status') == 'healthy' and payload.get('version') == expected:
                          print(json.dumps(payload, indent=2))
                          sys.exit(0)
                      last_error = f"unexpected health payload status={payload.get('status')} version={payload.get('version')}"
              except Exception as exc:
                  last_error = type(exc).__name__
              time.sleep(5)
          print(f'Authenticated public health check did not expose expected version {expected}. Last response type: {last_error}', file=sys.stderr)
          sys.exit(1)

  reingest-youtube-catalog:
    name: Rebuild production catalog on VPS
    runs-on: ubuntu-24.04
    needs: [deploy]
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'deploy_only'
    environment:
      name: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Ansible
        shell: bash
        run: |
          python3 -m venv .ansible-venv
          . .ansible-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ansible==12.3.0
          python deploy/test_worker_resources.py
          ansible-galaxy collection install -r deploy/requirements.yml
          echo "$PWD/.ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Configure SSH key
        shell: bash
        env:
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY || secrets.VPS_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa_racknerd
          chmod 600 ~/.ssh/id_rsa_racknerd

          expected_host_key="$(printf '%s\n' "${VPS_SSH_HOST_KEY:-}" | sed -e 's/\r$//' -e '/^[[:space:]]*$/d' -e '/^[[:space:]]*#/d' | sort -u)"
          if [[ -z "$expected_host_key" ]]; then
            echo "VPS_SSH_HOST_KEY repository variable or secret must be set before production reingest." >&2
            exit 1
          fi

          scanned_host_key="$(ssh-keyscan -T 10 -t ed25519 198.23.137.16 2>/dev/null | sed -e 's/\r$//' -e '/^[[:space:]]*$/d' -e '/^[[:space:]]*#/d' | sort -u)"
          if [[ "$scanned_host_key" != "$expected_host_key" ]]; then
            echo "VPS SSH host key mismatch; refusing to update known_hosts." >&2
            exit 1
          fi

          printf '%s\n' "$expected_host_key" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa_racknerd -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@198.23.137.16 'echo "SSH OK"'

      - name: Re-ingest all sources and repair artifacts on VPS
        shell: bash
        env:
          REBUILD_BASE_ID: ${{ inputs.rebuild_base_id }}
          REBUILD_TRANSCRIPTION_MODE: ${{ inputs.rebuild_transcription_mode }}
        run: |
          HOST="deploy@198.23.137.16"
          SSH="ssh -i ~/.ssh/id_rsa_racknerd -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          COMPOSE="docker compose -f /opt/apps/keyspilli/compose.production.yml"
          if [ -n "$REBUILD_BASE_ID" ] && [[ ! "$REBUILD_BASE_ID" =~ ^[a-z0-9][a-z0-9-]{0,119}$ ]]; then
            echo "Invalid rebuild_base_id; expected a catalog base id slug." >&2
            exit 1
          fi
          case "$REBUILD_TRANSCRIPTION_MODE" in
            strict) YOUTUBE_REINGEST_ARGS="--source=root --keep-existing-tempo" ;;
            preserve-melody)
              if [ -z "$REBUILD_BASE_ID" ]; then
                echo "preserve-melody is only allowed for a targeted rebuild; refusing a full-catalog raw transcription run." >&2
                exit 1
              fi
              YOUTUBE_REINGEST_ARGS="--source=root --keep-existing-tempo --preserve-melody"
              ;;
            *)
              echo "Invalid rebuild_transcription_mode: $REBUILD_TRANSCRIPTION_MODE" >&2
              exit 1
              ;;
          esac
          echo "YouTube transcription mode: $REBUILD_TRANSCRIPTION_MODE"
          REBUILD_ENV=""
          if [ -n "$REBUILD_BASE_ID" ]; then
            REBUILD_ENV="-e REBUILD_BASE_ID=$REBUILD_BASE_ID"
            echo "Targeted rebuild: $REBUILD_BASE_ID"
          else
            echo "Full catalog rebuild"
          fi
          # Push curated seed MIDIs (tracked in git) into the data volume so
          # restore-curated.ts can rebuild them from the seed arrangement.
          for f in data/seed-midi/*.mid; do
            [ -f "$f" ] || continue
            NAME="$(basename "$f")"
            $SSH $HOST "$COMPOSE exec -T -i worker sh -c 'mkdir -p /data/seed-midi && cat > /data/seed-midi/$NAME'" < "$f"
          done
          # Manifest metadata for curated restores inside the worker container.
          # Write the policy file to the same mounted volume and rename it only
          # after the transfer completes. Readers therefore see either the
          # previous complete manifest or the new complete manifest, never a
          # partially streamed JSON document.
          $SSH $HOST "$COMPOSE exec -T -i worker sh -c 'set -eu; cat > /data/.manifest.json.tmp; mv -f /data/.manifest.json.tmp /data/manifest.json'" < catalog/manifest.json
          # Learner review data keeps known source-identity failures out of the
          # public catalogue while they are awaiting a replacement source.
          $SSH $HOST "$COMPOSE exec -T -i worker sh -c 'set -eu; cat > /data/.learner-review.json.tmp; mv -f /data/.learner-review.json.tmp /data/learner-review.json'" < catalog/learner-review.json
          if [ -n "$REBUILD_BASE_ID" ]; then
            # A targeted run with an unknown base would otherwise let every
            # stage skip cleanly and still report success (verify-catalog
            # verifies an empty selection). Accept an existing DB base or a
            # curated seed copied above that restore-curated.ts can publish.
            $SSH $HOST "cd /opt/apps/keyspilli && $COMPOSE exec -T $REBUILD_ENV worker node --import tsx packages/catalog/scripts/assert-rebuild-target.ts $REBUILD_BASE_ID"
          fi
          # Clear the sentinel synchronously before starting the detached
          # process. Clearing it inside `exec -d` races the first poll and can
          # make a previous REBUILD_COMPLETE marker look like this run's
          # success.
          $SSH $HOST "$COMPOSE exec -T worker sh -c ': > /tmp/reingest.log'"
          # Run detached inside the worker container so a dropped SSH channel
          # cannot kill the rebuild.  A failure marker makes the poll fail fast
          # instead of tailing stale output until the 60-minute job timeout.
          # Supplying rebuild_base_id narrows every source/repair/gate step to
          # one base, which is useful for a focused production repair.
          $SSH $HOST "cd /opt/apps/keyspilli && $COMPOSE exec -T -d $REBUILD_ENV worker sh -c 'REBUILD_BASE_ID=\"\${REBUILD_BASE_ID:-}\"; if [ -n \"\$REBUILD_BASE_ID\" ]; then if { node --import tsx packages/catalog/scripts/reingest-all-youtube.ts $YOUTUBE_REINGEST_ARGS \"\$REBUILD_BASE_ID\" && node --import tsx packages/catalog/scripts/restore-curated.ts \"\$REBUILD_BASE_ID\" && node --import tsx packages/catalog/scripts/reingest-catalog.ts --source=root --skip-youtube \"\$REBUILD_BASE_ID\" && node --import tsx packages/catalog/scripts/repair-artifacts.ts --base-id \"\$REBUILD_BASE_ID\" && node --import tsx packages/catalog/scripts/verify-catalog.ts \"\$REBUILD_BASE_ID\" && echo \"REBUILD_COMPLETE:\$REBUILD_BASE_ID\"; } >> /tmp/reingest.log 2>&1; then :; else rc=\$?; echo REBUILD_FAILED:\$rc >> /tmp/reingest.log; exit \$rc; fi; else if { node --import tsx packages/catalog/scripts/reingest-all-youtube.ts $YOUTUBE_REINGEST_ARGS && node --import tsx packages/catalog/scripts/restore-curated.ts && node --import tsx packages/catalog/scripts/reingest-catalog.ts --source=root --skip-youtube && node --import tsx packages/catalog/scripts/repair-artifacts.ts && node --import tsx packages/catalog/scripts/verify-catalog.ts && echo REBUILD_COMPLETE:full; } >> /tmp/reingest.log 2>&1; then :; else rc=\$?; echo REBUILD_FAILED:\$rc >> /tmp/reingest.log; exit \$rc; fi; fi'"
          for i in $(seq 1 240); do
            sleep 15
            OUT=$($SSH $HOST "$COMPOSE exec -T worker sh -c 'tail -3 /tmp/reingest.log'" 2>/dev/null || true)
            echo "$OUT" | tail -3
            if echo "$OUT" | grep -Eq "REBUILD_(COMPLETE|FAILED)"; then break; fi
          done
          $SSH $HOST "$COMPOSE exec -T worker sh -c 'cat /tmp/reingest.log'" > /tmp/reingest-full.log 2>&1 || true
          tail -6 /tmp/reingest-full.log
          if grep -q "REBUILD_FAILED" /tmp/reingest-full.log || \
             ! grep -q "REBUILD_COMPLETE" /tmp/reingest-full.log || \
             ! grep -q "re-ingested" /tmp/reingest-full.log || \
             ! grep -q "restored" /tmp/reingest-full.log || \
             ! grep -q "reingest-catalog:" /tmp/reingest-full.log || \
             ! grep -q "repair-artifacts:" /tmp/reingest-full.log || \
             ! grep -q "verify-catalog: 0 of" /tmp/reingest-full.log; then
            echo "rebuild did not complete:"
            grep -E "^(x|-)" /tmp/reingest-full.log | head -10 || true
            exit 1
          fi
          if [ -n "$REBUILD_BASE_ID" ] && ! grep -q "REBUILD_COMPLETE:$REBUILD_BASE_ID" /tmp/reingest-full.log; then
            echo "targeted rebuild did not publish its requested completion marker: $REBUILD_BASE_ID" >&2
            exit 1
          fi
      - name: Verify authenticated live catalog and rebuild target
        shell: bash
        env:
          KEYSPILLI_ACCESS_USERNAME: ${{ secrets.KEYSPILLI_ACCESS_USERNAME }}
          KEYSPILLI_ACCESS_PASSWORD: ${{ secrets.KEYSPILLI_ACCESS_PASSWORD }}
          KEYSPILLI_DEPLOY_URL: https://keys.reidar.tech
          KEYSPILLI_EXPECTED_SHA: ${{ github.sha }}
          KEYSPILLI_VERIFY_BASE_ID: ${{ inputs.rebuild_base_id }}
        run: python3 deploy/keyspilli-live-verifier.py
