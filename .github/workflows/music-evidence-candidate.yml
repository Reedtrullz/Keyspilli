name: Music evidence candidate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-evidence-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-contracts:
    name: Offline music evidence contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
      - name: Enable pnpm via Corepack (version pinned by packageManager)
        run: corepack enable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r services/transcribe/requirements-player-evidence.txt
      - name: Pure analyzer and fail-closed release tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s services/transcribe/test -p 'test_player*.py'
          python scripts/test_check_music_release.py
      - name: Report, comparison, preview and packet contracts
        run: |
          pnpm --filter @keyspilli/web exec vitest run src/lib/player-music-review.test.ts src/lib/player-preparation-boundary.test.ts src/lib/player-input-qualification.test.ts src/lib/music-qualification-score.test.ts src/lib/player-history-comparison.test.ts src/lib/player-repair-boundary.test.ts src/lib/player-reference-bank.test.ts src/lib/music-review-jobs.test.ts src/lib/music-review.test.ts src/lib/music-review-cli.test.ts src/lib/music-correspondence.test.ts src/lib/music-event-comparison.test.ts src/lib/music-repair-preview.test.ts src/lib/anti-music-evidence.test.ts
          pnpm run typecheck
      - name: Reproducible plugin package
        run: |
          python scripts/test_package_keyspilli_plugin.py
          python scripts/package-keyspilli-plugin.py --source plugins/keyspilli --output "$RUNNER_TEMP/keyspilli-plugin.zip" --manifest "$RUNNER_TEMP/keyspilli-plugin.json"
      - name: Retain candidate plugin artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyspilli-plugin-${{ github.sha }}
          path: |
            ${{ runner.temp }}/keyspilli-plugin.zip
            ${{ runner.temp }}/keyspilli-plugin.json
          retention-days: 14
