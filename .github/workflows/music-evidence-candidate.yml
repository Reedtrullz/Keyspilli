name: Music evidence candidate
on:
  pull_request:
    branches: [main, codex/keyspilli-listening-review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-evidence-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-contracts:
    name: Offline music evidence contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.22.3'
          cache: npm
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r services/transcribe/requirements-player-evidence.txt
      - name: Pure analyzer and fail-closed release tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s services/transcribe/test -p 'test_*evidence.py'
          python scripts/test_check_music_release.py
      - name: Report, comparison, preview and packet contracts
        run: |
          npm exec -w @keyspilli/web -- vitest run src/lib/player-music-review.test.ts src/lib/player-preparation-boundary.test.ts src/lib/player-input-qualification.test.ts src/lib/music-qualification-score.test.ts src/lib/player-history-comparison.test.ts src/lib/player-repair-boundary.test.ts src/lib/player-reference-bank.test.ts src/lib/music-review-jobs.test.ts src/lib/music-review.test.ts src/lib/music-review-cli.test.ts src/lib/music-correspondence.test.ts src/lib/music-event-comparison.test.ts src/lib/music-repair-preview.test.ts src/lib/anti-music-evidence.test.ts
          npm run typecheck
      - name: Reproducible plugin package
        run: |
          python scripts/test_package_keyspilli_plugin.py
          python scripts/package-keyspilli-plugin.py --source plugins/keyspilli --output "$RUNNER_TEMP/keyspilli-plugin.zip" --manifest "$RUNNER_TEMP/keyspilli-plugin.json"
      - name: Retain candidate plugin artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keyspilli-plugin-${{ github.sha }}
          path: |
            ${{ runner.temp }}/keyspilli-plugin.zip
            ${{ runner.temp }}/keyspilli-plugin.json
          retention-days: 14
