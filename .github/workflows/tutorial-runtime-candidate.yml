name: Tutorial runtime candidate

on:
  pull_request:
    paths:
      - '.github/workflows/tutorial-runtime-candidate.yml'
      - 'services/transcribe/src/**'
      - 'services/transcribe/package.json'
      - 'services/transcribe/tsconfig.json'
      - 'packages/catalog/**'
      - 'packages/midi/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'services/transcribe/test/test_tutorial_*.py'
      - 'services/transcribe/Dockerfile.tutorial*'
      - 'services/transcribe/requirements-tutorial.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorial-runtime-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container-smoke:
    defaults:
      run:
        shell: >-
          python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'deploy/evidence-step.py'),run_name='__main__')" {0}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reserve owned test resources
        run: python3 deploy/evidence-job.py begin
      - name: Build candidate (includes real geometry import and synthetic tests)
        run: docker build --platform linux/amd64 -f services/transcribe/Dockerfile.tutorial -t keyspilli-tutorial:candidate .
      - name: Build worker candidate on native amd64
        run: |
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 -f services/transcribe/Dockerfile.tutorial --target worker -t keyspilli-tutorial-worker:candidate .
      - name: Verify isolated default worker startup and SIGTERM
        timeout-minutes: 2
        run: |
          name=keyspilli-tutorial-worker-smoke
          trap 'docker logs "$name" 2>&1 || true; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 1g --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,size=128m \
            --tmpfs /data:rw,nosuid,size=128m,uid=65532,gid=65532,mode=0700 \
            keyspilli-tutorial-worker:candidate
          for attempt in $(seq 1 30); do
            test "$(docker inspect --format '{{.State.Running}}' "$name")" = true || exit 1
            worker_logs=$(docker logs "$name" 2>&1)
            if grep -Fq '[worker] polling every 5000ms' <<< "$worker_logs"; then
              sleep 5
              test "$(docker inspect --format '{{.State.Running}}' "$name")" = true || exit 1
              worker_logs=$(docker logs "$name" 2>&1)
              if grep -Fq '[worker] poll error:' <<< "$worker_logs"; then
                exit 1
              fi
              docker exec "$name" node --import tsx services/transcribe/src/worker-health-check.ts
              docker stop --time 10 "$name"
              test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0
              docker logs "$name" 2>&1 | grep -Fq '"status":"stopped"'
              exit 0
            fi
            sleep 1
          done
          echo 'Worker did not reach its default polling loop within 30 seconds' >&2
          exit 1
      - name: Verify isolated CLI and dependency consistency
        run: |
          docker run --rm --network none keyspilli-tutorial:candidate --help
          docker run --rm --network none --entrypoint python keyspilli-tutorial:candidate -m pip check
      - name: Verify non-root geometry initialization
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=128m --entrypoint python keyspilli-tutorial:candidate -c "from lumachords.keybed_detector import KeybedDetector; from lumachords.image_input import ImagePreprocessor; from lumachords.preferences import Preferences; from lumachords.runtime_config import RuntimeConfig, AppMode, ProdMode, LogLevel; KeybedDetector(Preferences(), RuntimeConfig(AppMode.HEADLESS, ProdMode.PROD, LogLevel.LOGLEVEL_NONE)).init_state()"
      - name: Verify synthetic extraction and timing tests
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,size=128m --entrypoint python keyspilli-tutorial:candidate -m unittest discover -s /app/test -p 'test_tutorial_*.py'
      - name: Record resolved image and native package evidence
        run: |
          docker image inspect keyspilli-tutorial:candidate --format '{{.Id}}'
          docker run --rm --network none --entrypoint python keyspilli-tutorial:candidate -m pip freeze
          docker run --rm --network none --entrypoint dpkg-query keyspilli-tutorial:candidate -W

      - name: Release owned test resources
        if: always()
        env:
          KEYSPILLI_EVIDENCE_FINISHING: "1"
          JOB_STATUS: ${{ job.status }}
        run: sudo --preserve-env=RUNNER_TEMP,KEYSPILLI_EVIDENCE_ROOT,KEYSPILLI_EVIDENCE_RUN,KEYSPILLI_REAL_DOCKER,JOB_STATUS python3 deploy/evidence-job.py finish
      - name: Retain raw results and reconstruction maps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tutorial-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/keyspilli-evidence.tar.gz
          retention-days: 90
