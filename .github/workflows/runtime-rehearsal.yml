name: Runtime rehearsal (native amd64, isolated-candidate-rehearsal)

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-rehearsal.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/web/package.json'
      - 'apps/web/Dockerfile'
      - 'apps/web/src/components/player/**'
      - 'apps/web/scripts/verify-native-player.mts'
      - 'apps/web/scripts/prepare-native-piano.mts'
      - 'apps/web/scripts/fixtures/native-piano-assets.json'
      - 'apps/web/src/lib/native-player-assets*'
      - 'apps/web/src/lib/player-reference-bank*'
      - 'apps/web/e2e/player-audio-capture.ts'
      - 'packages/player-core/**'
      - 'deploy/restore-app*'
      - 'deploy/evidence-docker.py'
      - 'deploy/evidence_resources.py'
      - 'deploy/test/test-evidence.py'
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Full 40-hex SHA this rehearsal must run at (must equal the dispatched ref)"
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.3
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: runtime-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearsal:
    defaults:
      run:
        shell: >-
          python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'deploy/evidence-step.py'),run_name='__main__')" {0}
    name: Native amd64 restore and canary on the public seed catalog (no production access)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require native amd64 and exact commit
        run: |
          test "$(uname -m)" = x86_64
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm via Corepack (version pinned by packageManager)
        run: corepack enable

      - name: Reserve owned test resources
        run: python3 deploy/evidence-job.py begin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare the hash-pinned piano input outside the isolated container
        timeout-minutes: 3
        run: |
          node --import tsx apps/web/scripts/prepare-native-piano.mts > "$KEYSPILLI_EVIDENCE/native-piano-preparation.json"
          echo "KEYSPILLI_NATIVE_PIANO_DIR=$KEYSPILLI_SCRATCH/native-piano" >> "$GITHUB_ENV"

      - name: Build the public seed catalog
        run: |
          pnpm exec tsx packages/catalog/scripts/fetch-seed.ts
          pnpm run pipeline

      - name: Build web and worker candidates on native amd64
        run: |
          docker build --platform linux/amd64 -f apps/web/Dockerfile --build-arg VERSION="$EXPECTED_COMMIT" -t keyspilli-rehearsal-web:candidate .
          docker build --platform linux/amd64 -f services/transcribe/Dockerfile.tutorial --target worker -t keyspilli-rehearsal-worker:candidate .

      - name: Worker startup and clean SIGTERM shutdown
        timeout-minutes: 3
        run: |
          name=keyspilli-rehearsal-worker
          trap 'docker logs "$name" 2>&1 || true; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 1g --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,size=128m \
            --tmpfs /data:rw,nosuid,size=128m,uid=65532,gid=65532,mode=0700 \
            keyspilli-rehearsal-worker:candidate
          for attempt in $(seq 1 30); do
            test "$(docker inspect --format '{{.State.Running}}' "$name")" = true || exit 1
            if docker logs "$name" 2>&1 | grep -Fq '[worker] polling every 5000ms'; then
              sleep 5
              test "$(docker inspect --format '{{.State.Running}}' "$name")" = true || exit 1
              ! docker logs "$name" 2>&1 | grep -Fq '[worker] poll error:'
              docker exec "$name" node --import tsx services/transcribe/src/worker-health-check.ts
              docker stop --time 10 "$name"
              test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0
              docker logs "$name" 2>&1 | grep -Fq '"status":"stopped"'
              exit 0
            fi
            sleep 1
          done
          echo 'Worker did not reach its polling loop within 30 seconds' >&2
          exit 1

      - name: Backup, isolated restore and restored-app canary
        timeout-minutes: 12
        run: |
          mkdir -p rehearsal-out
          export KEYSPILLI_BACKUP_WEB_IMAGE_ID="$(docker image inspect keyspilli-rehearsal-web:candidate --format '{{.Id}}')"
          export KEYSPILLI_BACKUP_WEB_REVISION="$EXPECTED_COMMIT"
          export KEYSPILLI_BACKUP_WORKER_IMAGE_ID="$(docker image inspect keyspilli-rehearsal-worker:candidate --format '{{.Id}}')"
          export KEYSPILLI_BACKUP_WORKER_REVISION="$EXPECTED_COMMIT"
          export RESTORE_SONG_ID="$(node --import tsx --input-type=module -e '
            import {listSongs, getDb} from "./packages/catalog/src/db.ts";
            const song = listSongs({publicOnly: true, limit: 200}).filter(s => s.hasSheetXml === 1 && s.difficulty === "easy").sort((a,b) => a.duration-b.duration)[0];
            if (!song) throw new Error("No public seed export fixture");
            console.log(song.id); getDb().close();
          ')"
          python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          source = Path("data").resolve()
          for name in ("manifest.json", "learner-review.json"):
              shutil.copyfile(Path("catalog") / name, source / name)
          root = Path(os.environ["KEYSPILLI_SCRATCH"]) / "rehearsal"
          root.mkdir()
          env = {**os.environ, "KEYSPILLI_DATA_DIR": str(source), "KEYSPILLI_BACKUP_DIR": str(root / "backups")}
          subprocess.run(["bash", "deploy/backup.sh"], env=env, check=True, timeout=120)
          manifests = list((root / "backups").glob("backup-manifest-*.json"))
          assert len(manifests) == 1
          subprocess.run(["bash", "deploy/restore-drill.sh", str(manifests[0]), str(root / "restored"),
                          "--verify-app", env["KEYSPILLI_BACKUP_WEB_IMAGE_ID"], env["KEYSPILLI_BACKUP_WEB_REVISION"],
                          env["RESTORE_SONG_ID"]], check=True, timeout=420)
          try:
              subprocess.run(["python3", "deploy/restore-app.py", str(manifests[0]), str(root / "restored"),
                              env["KEYSPILLI_BACKUP_WEB_IMAGE_ID"], env["KEYSPILLI_BACKUP_WEB_REVISION"],
                              env["RESTORE_SONG_ID"], "--sampled", "--image-sizes"], check=True, timeout=420)
          finally:
              shutil.copyfile(root / "restored" / "restore-report.json", Path("rehearsal-out/restore-report.json"))
              if (root / "restored" / "native-player").exists():
                  shutil.copytree(root / "restored" / "native-player", Path("rehearsal-out/native-player"))
          report = json.loads((root / "restored" / "restore-report.json").read_text())
          assert report["applicationVerification"] == "passed"
          assert report["restoredRevision"] == env["KEYSPILLI_BACKUP_WEB_REVISION"]
          assert report["webImageId"] == env["KEYSPILLI_BACKUP_WEB_IMAGE_ID"]
          assert report["sampledBrowser"]["status"] == "passed"
          assert not subprocess.check_output(["docker", "ps", "-aq", "--filter", "name=^/keyspilli-restore-"], text=True).strip()
          PY

      - name: Write rehearsal receipt
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          out = Path("rehearsal-out")
          report = json.loads((out / "restore-report.json").read_text())
          assert report["sampledBrowser"]["status"] == "passed"
          receipt = {
              "kind": "keyspilli-runtime-rehearsal",
              "runtimeScope": "isolated-candidate-rehearsal",
              "commit": os.environ["EXPECTED_COMMIT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "arch": platform.machine(),
              "catalog": "public-seed-not-production",
              "workerStartupAndSigterm": "passed",
              "restoreAndCanary": report["applicationVerification"],
              "webImageId": report["webImageId"],
              "canary": report.get("application"),
              "runtimeLimits": report["runtimeLimits"],
              "nativeImageSizes": report["nativeImageSizes"],
              "nativeImageSizeLimitBytes": report["nativeImageSizeLimitBytes"],
              "sampledBrowser": report["sampledBrowser"],
          }
          path = out / "runtime-rehearsal-receipt.json"
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          (out / "runtime-rehearsal-receipt.sha256").write_text(digest + "\n")
          summary = f"commit {receipt['commit']}\nevent {receipt['event']}\nreceiptSha256 {digest}\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("### Runtime rehearsal\n" + summary)
          print(summary)
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-rehearsal-receipt-${{ env.EXPECTED_COMMIT }}
          path: |
            rehearsal-out/runtime-rehearsal-receipt.json
            rehearsal-out/runtime-rehearsal-receipt.sha256
          if-no-files-found: error

      - name: Release owned test resources
        if: always()
        env:
          KEYSPILLI_EVIDENCE_FINISHING: "1"
          JOB_STATUS: ${{ job.status }}
        run: sudo --preserve-env=RUNNER_TEMP,KEYSPILLI_EVIDENCE_ROOT,KEYSPILLI_EVIDENCE_RUN,KEYSPILLI_REAL_DOCKER,JOB_STATUS python3 deploy/evidence-job.py finish

      - name: Retain raw results and reconstruction maps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-rehearsal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/keyspilli-evidence.tar.gz
            rehearsal-out
          retention-days: 90
